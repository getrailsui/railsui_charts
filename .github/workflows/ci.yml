name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # One Ruby. The gemspec allows 2.7 and up, so this does not prove the
      # floor — but nothing here is version-sensitive, and a matrix costs a run
      # per entry on every push for a result that has never differed.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      # 22.15 is the floor the JavaScript tests need: test/javascript/stubs.mjs
      # satisfies the controllers' bare imports through Node's own module hooks,
      # which are not available before then. Pinned to the floor rather than to
      # the latest so that the floor is what gets proven.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: corepack enable
      - run: yarn install --immutable

      # Covers the importmap bundle too. app/assets/javascripts/railsui_charts.js
      # is committed, because it is what importmap applications are served
      # straight out of the gem, and a stale one is a fix that ships to npm and
      # not to them. The packaging test rebuilds it with esbuild and compares
      # bytes, which is why there is no separate build-and-diff job.
      - run: bundle exec rake test

      # Catches a gemspec that names a file the repository does not have, which
      # `rake test` never touches and only a release would otherwise discover.
      - run: gem build railsui_charts.gemspec
