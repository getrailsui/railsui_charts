name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.3", "3.4"]
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      # 22.15 is the floor the JavaScript tests need: test/javascript/stubs.mjs
      # satisfies the controllers' bare imports through Node's own module hooks,
      # which are not available before then. Pinned to the floor rather than to
      # the latest so that the floor is what gets proven.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - run: corepack enable
      - run: yarn install --immutable
      - run: bundle exec rake test

  rails_7:
    name: Rails 7.0
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: gemfiles/rails_7.0.gemfile
    steps:
      - uses: actions/checkout@v7

      # One Ruby rather than the matrix, so a failure here means Rails and not
      # Rails-crossed-with-a-Ruby.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      # The Ruby suite only: the JavaScript does not know what Rails is.
      - run: bundle exec rake test:ruby

  bundle_is_current:
    name: Importmap bundle matches the controllers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn build

      # app/assets/javascripts/railsui_charts.js is committed, because it is
      # what importmap applications are served straight out of the gem. If a
      # rebuild moves it, the commit is carrying a build its own sources no
      # longer produce, and the fix ships to npm and not to importmap.
      #
      # Not the same check as the packaging test, though it looks like it. That
      # test spells the esbuild flags out itself, so it goes on passing against
      # its own copy of them if the build script in package.json changes. This
      # runs the script the release actually runs.
      - name: The committed bundle must match a fresh build
        run: |
          git diff --exit-code -- app/assets/javascripts/railsui_charts.js \
            || { echo "::error::Run \`yarn build\` and commit the result."; exit 1; }

  gem:
    name: Gem builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      # Catches a gemspec that names a file the repository does not have, which
      # `rake test` never touches and only a release would otherwise discover.
      - run: gem build railsui_charts.gemspec
